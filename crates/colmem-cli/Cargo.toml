[package]
name = "colmem-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
colmem-core = { path = "../colmem-core" }
colmem-hosts = { path = "../colmem-hosts" }
serde_json = "1"
ureq = { version = "2.12.1", optional = true, features = ["json"] }

[features]
default = []
semantic-embeddings = ["colmem-core/semantic-embeddings"]
remote-embeddings = ["dep:ureq"]

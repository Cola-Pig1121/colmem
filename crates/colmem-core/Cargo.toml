[package]
name = "colmem-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fastembed = { version = "5.13.2", optional = true, default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
semantic-embeddings = ["dep:fastembed"]
